<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Audio di HTML</title>
</head>
<body>
  <h1>Menambahkan Audio</h1>

  <!-- Letakkan file audio kamu (mis. lagu.mp3) di folder media -->
  <audio controls>
    <source src="media/lagu.mp3" type="audio/mpeg">
    <source src="media/lagu.ogg" type="audio/ogg">
    Browser kamu tidak mendukung tag audio.
  </audio>

  <p>Atribut berguna: controls, autoplay, loop, muted, preload.</p>
</body>
</html>
