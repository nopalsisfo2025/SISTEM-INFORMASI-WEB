<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gambar di HTML</title>
</head>
<body>
  <h1>Menampilkan Gambar</h1>

  <!-- src = lokasi file, alt = teks pengganti jika gambar gagal dimuat -->
  <img src="media/gambar.svg" alt="Lingkaran hijau bertuliskan Gambar">

  <p>Mengatur ukuran dengan atribut width:</p>
  <img src="media/gambar.svg" alt="Lingkaran hijau" width="160">

  <figure>
    <img src="media/gambar.svg" alt="Lingkaran hijau" width="200">
    <figcaption>Keterangan gambar dengan figure dan figcaption.</figcaption>
  </figure>
</body>
</html>
