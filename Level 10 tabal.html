<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel di HTML</title>
  <style>
    table, th, td { border: 1px solid #444; border-collapse: collapse; padding: 6px 10px; }
    th { background: #e0f2f1; }
  </style>
</head>
<body>
  <h1>Daftar Nilai Siswa</h1>
  <table>
    <caption>Nilai ujian semester</caption>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama</th>
        <th>Matematika</th>
        <th>Bahasa</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Andi</td>
        <td>85</td>
        <td>90</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Sari</td>
        <td>92</td>
        <td>88</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Rata-rata</td>
        <td>88,5</td>
        <td>89</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
