<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Text Formatting di HTML</title>
</head>
<body>
  <p>Teks <b>bold</b> dan teks <strong>sangat penting</strong>.</p>
  <p>Teks <i>miring</i> dan teks <em>ditekankan</em>.</p>
  <p>Teks <u>bergaris bawah</u> dan teks <s>dicoret</s>.</p>
  <p>Teks <mark>disorot</mark> dan teks <small>kecil</small>.</p>
  <p>Rumus air: H<sub>2</sub>O. Luas: 5m<sup>2</sup>.</p>
  <p>Kata <del>lama</del> diganti <ins>baru</ins>.</p>
  <p>Kode: <code>console.log("halo")</code></p>
  <blockquote>Ini kutipan panjang yang ditulis dengan blockquote.</blockquote>
  <p>Singkatan: <abbr title="HyperText Markup Language">HTML</abbr></p>
</body>
</html>
